# configs/default.yaml — 默认训练配置
# 本配置适用于 CPU 训练，参数设置偏小以确保训练速度可接受

# ============================================================
# 模型超参数
# ============================================================
model:
  d_model: 128        # 模型隐藏维度（嵌入维度）
  num_heads: 4        # 注意力头数（d_model 必须能被 num_heads 整除）
  d_ff: 512           # 前馈网络隐藏层维度（通常为 d_model 的 4 倍）
  num_layers: 2       # 编码器/解码器的层数
  max_len: 256        # 支持的最大序列长度
  dropout: 0.1        # Dropout 比率

# ============================================================
# 训练超参数
# ============================================================
training:
  batch_size: 64      # 批次大小
  learning_rate: 0.001  # 学习率（Adam 优化器）
  epochs: 30          # 训练轮数
  seq_len: 64         # 输入序列长度
  train_ratio: 0.9    # 训练集占比（剩余为验证集）
  grad_clip: 1.0      # 梯度裁剪阈值（防止梯度爆炸）
  log_interval: 50    # 每隔多少个 batch 打印一次日志
  save_interval: 5    # 每隔多少个 epoch 保存一次模型

# ============================================================
# 数据配置
# ============================================================
data:
  data_dir: "data"    # 数据目录（相对于项目根目录）

# ============================================================
# 实验配置
# ============================================================
experiment:
  name: "baseline"              # 实验名称
  output_dir: "experiments/baseline"  # 输出目录
