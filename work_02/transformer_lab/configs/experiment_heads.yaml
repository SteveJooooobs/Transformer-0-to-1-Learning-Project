# configs/experiment_heads.yaml — 修改注意力头数的实验
# 目的：观察不同 head 数量对模型性能的影响
# 使用方式：通过命令行参数 --num_heads 覆盖

model:
  d_model: 128
  num_heads: 4        # 可修改为 1, 2, 4, 8
  d_ff: 512
  num_layers: 2
  max_len: 256
  dropout: 0.1

training:
  batch_size: 64
  learning_rate: 0.001
  epochs: 20
  seq_len: 64
  train_ratio: 0.9
  grad_clip: 1.0
  log_interval: 50
  save_interval: 5

data:
  data_dir: "data"

experiment:
  name: "vary_heads"
  output_dir: "experiments/vary_heads"
